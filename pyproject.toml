[project]
name = "neonbot"
version = "2.5.0"
description = ""
authors = [
    { name = "NeonSpectrum", email = "youngskymann@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "environs (>=14.1.1,<15.0.0)",
    "motor (>=3.7.0,<4.0.0)",
    "python-i18n (>=0.3.9,<0.4.0)",
    "dnspython (>=2.7.0,<3.0.0)",
    "pynacl (>=1.5.0,<2.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "envparse (>=0.2.0,<0.3.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "fuzzywuzzy (>=0.18.0,<0.19.0)",
    "python-levenshtein (>=0.27.1,<0.28.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "beanie (>=2.0.1,<3.0.0)",
    "openai (>=2.21.0,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "validators (>=0.35.0,<0.36.0)",
    "markdown (>=3.8,<4.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "discord-py[voice] (>=2.5.2,<3.0.0)",
    "jikanpy-v4 (>=1.0.2,<2.0.0)",
    "google-auth (>=2.40.3,<3.0.0)",
    "durations-nlp (>=1.0.1,<2.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "lavalink (>=5.9.0,<6.0.0)",
    "ytmusicapi (>=1.11.1,<2.0.0)",
    "google-genai (>=1.59.0,<2.0.0)",
    "json-repair (>=0.58.0,<0.59.0)",
    "gitpython (>=3.1.46,<4.0.0)",
    "importlib (>=1.0.4,<2.0.0)",
    "coloredlogs (>=15.0.1,<16.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.2"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
case-sensitive = true